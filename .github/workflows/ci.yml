name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A push to main may be deploying; let it finish (the newest pending run still replaces older pending ones).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Secret scan, lint, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # pnpm version comes from package.json `packageManager`
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan (all tracked files)
        run: node scripts/secrets-scan.mjs --all
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration-e2e:
    name: Integration, build + bundle scan, e2e
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0 # match devDependency `supabase`
      - name: Start local Supabase
        run: supabase start
      - name: Reset local database (apply all migrations)
        run: supabase db reset
      # Writes .env.development.local (local demo keys) without printing values.
      # `next dev` reads it itself; other steps source it.
      - name: Write app env from local stack
        run: node scripts/ci-write-env.mjs
      - name: Integration tests
        run: |
          set -a; . ./.env.development.local; set +a
          pnpm test:integration
      - name: Build
        run: |
          set -a; . ./.env.development.local; set +a
          pnpm build
      - name: Client bundle secret scan
        run: pnpm bundle:scan
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Playwright starts `pnpm dev` itself when E2E_BASE_URL is unset.
      - name: E2E tests
        run: pnpm test:e2e
        env:
          PASSWORD_RESET_EMAIL: "on" # local Mailpit catches the reset email (D-094)
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # D-105: a green push to main applies new migrations, then deploys production.
  deploy:
    name: Deploy to production
    needs: integration-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VERCEL_ORG_ID: team_Om2dy9GPvS3PveEShKb5sWC4 # kurtgavs-projects (not secret)
      VERCEL_PROJECT_ID: prj_3FifXXGneBtCiEWEMW6AlKttGXQo # garage-desk (not secret)
      SITE: https://garage-desk-tau.vercel.app
    steps:
      - name: Check deploy secrets
        id: cfg
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$SUPABASE_DB_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy skipped: set the VERCEL_TOKEN and SUPABASE_DB_URL repository secrets (docs/NEXT-STEPS.md)."
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: steps.cfg.outputs.ready == 'true'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0 # match devDependency `supabase`
      # Migrations first: the new code may need them, and they are written to keep the running code working.
      - name: Apply new migrations
        if: steps.cfg.outputs.ready == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
      # From a git archive (no .git): Vercel Hobby blocks deployments whose commit author is not the
      # account owner (D-075). --force skips the build cache, which once served stale CSS (D-089).
      - name: Deploy to Vercel
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/deploy"
          cd "$RUNNER_TEMP/deploy"
          url=$(npx --yes vercel@54.7.1 deploy --prod --yes --force --token "$VERCEL_TOKEN")
          npx --yes vercel@54.7.1 inspect "$url" --wait --timeout 10m --token "$VERCEL_TOKEN"
      - name: Smoke check
        if: steps.cfg.outputs.ready == 'true'
        run: |
          curl -fsS -o /dev/null "$SITE/"
          curl -fsS -o /dev/null "$SITE/login"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/dashboard")" = 307
